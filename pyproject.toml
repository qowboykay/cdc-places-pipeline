[project]
name = "cdc-places-pipeline"
version = "0.1.0"
description = "ELT pipeline for CDC PLACES public health data: Socrata API -> S3 -> Snowflake -> dbt -> Streamlit"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "sodapy>=2.2",
    "boto3>=1.34",
    "snowflake-connector-python>=3.6",
    "snowflake-sqlalchemy>=1.5",
    "duckdb>=1.0",
    "dbt-core>=1.8,<2.0",
    "dbt-snowflake>=1.8,<2.0",
    "dbt-duckdb>=1.8,<2.0",
    "streamlit>=1.35",
    "plotly>=5.22",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.1",
    "pre-commit>=3.7",
    "boto3-stubs[s3]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_places_pipeline"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that make live API/DB calls (deselect with -m 'not integration')",
]
