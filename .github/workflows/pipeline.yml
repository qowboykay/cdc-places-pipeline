name: Pipeline

on:
  schedule:
    # Every Monday at 06:00 UTC (CDC PLACES releases annually; weekly is plenty)
    - cron: "0 6 * * 1"
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Extract from Socrata API
        run: uv run python -m cdc_places_pipeline.cli extract --dataset places_county

      - name: Upload to S3
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          stage_path=$(
            uv run python -m cdc_places_pipeline.cli upload --dataset places_county \
            | tail -1 | awk '{print $NF}'
          )
          if [ -z "$stage_path" ]; then
            echo "ERROR: stage_path is empty -- upload likely failed"
            exit 1
          fi
          echo "stage_path=$stage_path" >> "$GITHUB_OUTPUT"

      - name: Load into Snowflake
        id: snowflake_load
        shell: bash
        run: |
          set -euo pipefail
          load_result=$(
            uv run python -m cdc_places_pipeline.cli snowflake-load \
              --dataset places_county \
              --stage-path "${{ steps.upload.outputs.stage_path }}"
          )
          echo "$load_result"
          row_count=$(echo "$load_result" | awk '{print $2}')
          echo "row_count=$row_count" >> "$GITHUB_OUTPUT"

      - name: dbt build (Snowflake)
        run: |
          uv run dbt build \
            --project-dir dbt \
            --profiles-dir dbt \
            --target snowflake

      - name: dbt source freshness
        run: |
          uv run dbt source freshness \
            --project-dir dbt \
            --profiles-dir dbt \
            --target snowflake

      - name: Pipeline summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Pipeline run summary"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Stage path | \`${{ steps.upload.outputs.stage_path }}\` |"
            echo "| Rows loaded | ${{ steps.snowflake_load.outputs.row_count }} |"
          } >> "$GITHUB_STEP_SUMMARY"
